<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" fill="none">
  <!-- Icon: A stylized "A" signal node with connecting arcs -->
  <g transform="translate(4, 4)">
    <!-- Outer arc ring -->
    <path d="M20 20 A14 14 0 0 1 34 20" stroke="#9b5de5" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M15 20 A19 19 0 0 1 39 20" stroke="#6c37e8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.35"/>
    <!-- Network node triangle -->
    <polygon points="27,6 15,26 39,26" fill="none" stroke="#6c37e8" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Inner dot -->
    <circle cx="27" cy="19" r="3" fill="#9b5de5"/>
    <!-- Corner dots -->
    <circle cx="27" cy="6" r="2" fill="#6c37e8"/>
    <circle cx="15" cy="26" r="2" fill="#6c37e8"/>
    <circle cx="39" cy="26" r="2" fill="#6c37e8"/>
  </g>
  <!-- Wordmark: AxivaNet -->
  <text x="58" y="34" font-family="'Arial', 'Helvetica', sans-serif" font-weight="700" font-size="22" letter-spacing="-0.5" fill="white">Axiva</text>
  <text x="122" y="34" font-family="'Arial', 'Helvetica', sans-serif" font-weight="700" font-size="22" letter-spacing="-0.5" fill="#9b5de5">Net</text>
</svg>
