<!DOCTYPE html>
<html>
<head>
  <link rel="preconnect" href="https://cdn.prod.website-files.com" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.prod.website-files.com" />
  <link rel="preconnect" href="https://d3e54v103j8qbb.cloudfront.net" crossorigin />
  <link rel="dns-prefetch" href="https://d3e54v103j8qbb.cloudfront.net" />
  <meta charset="utf-8">
  <title>Lottie Font Test</title>
  <style>
    body { background: #f5f5f5; font-family: sans-serif; padding: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .card { background: white; border-radius: 12px; padding: 10px; }
    .card h3 { margin: 0 0 8px; font-size: 14px; }
    .anim { width: 100%; height: 250px; background: #fafafa; border: 1px solid #eee; border-radius: 8px; }
    #log { background: #111; color: #0f0; font-family: monospace; font-size: 12px; padding: 12px; border-radius: 8px; margin-bottom: 20px; white-space: pre-wrap; }
  </style>
<style>.w-commerce-commercecartwrapper, .meet-wrapper { display: none !important; }</style>
</head>
<body>
  <h2>Lottie 5.12.2 Text Rendering Test</h2>
  <div id="log">Loading...</div>
  <div class="grid">
    <div class="card">
      <h3>feature-card-2.json (KPI Dashboard)</h3>
      <div id="anim2" class="anim"></div>
    </div>
    <div class="card">
      <h3>feature-card-3.json (CSAT Score / 99%)</h3>
      <div id="anim3" class="anim"></div>
    </div>
    <div class="card">
      <h3>feature-card-4.json (Campaign Kickoff)</h3>
      <div id="anim4" class="anim"></div>
    </div>
    <div class="card">
      <h3>feature-card.json (Live Coaching)</h3>
      <div id="anim1" class="anim"></div>
    </div>
  </div>

  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <script>
    var log = document.getElementById('log');
    function addLog(msg) { log.textContent += '\n' + msg; console.log(msg); }

    addLog('lottie version: ' + (typeof lottie !== 'undefined' ? lottie.version : 'NOT LOADED'));

    var anims = [
      { id: 'anim2', src: 'json-files/feature-card-2.json' },
      { id: 'anim3', src: 'json-files/feature-card-3.json' },
      { id: 'anim4', src: 'json-files/feature-card-4.json' },
      { id: 'anim1', src: 'json-files/feature-card.json'   },
    ];

    anims.forEach(function(a) {
      try {
        var anim = lottie.loadAnimation({
          container: document.getElementById(a.id),
          renderer: 'svg',
          loop: true,
          autoplay: true,
          path: a.src
        });
        anim.addEventListener('DOMLoaded', function() {
          addLog('✓ Loaded: ' + a.src);
          // Check if any text SVG elements exist
          var svg = document.getElementById(a.id).querySelector('svg');
          var texts = svg ? svg.querySelectorAll('text, tspan, [font-family]') : [];
          addLog('  SVG text elements: ' + texts.length);
          if (texts.length > 0) {
            texts.forEach(function(t) {
              addLog('  → <' + t.tagName + '> "' + (t.textContent||'').trim() + '" font="' + t.getAttribute('font-family') + '"');
            });
          }
        });
        anim.addEventListener('error', function(e) {
          addLog('✗ Error loading: ' + a.src + ' → ' + JSON.stringify(e));
        });
      } catch(e) {
        addLog('✗ Exception: ' + a.src + ' → ' + e.message);
      }
    });
  </script>
</body>
</html>
